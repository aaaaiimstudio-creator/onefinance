<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAAIIM OneFinance — Enterprise Wealth & Capital Management</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            corporate: {
              950: 'var(--bg-main, #060913)',
              900: 'var(--bg-card, #0b1120)',
              800: '#131c31',
              700: '#1e2d4a',
              border: 'rgba(255, 255, 255, 0.08)'
            },
            accent: {
              primary: 'var(--primary-color, #D4AF37)',
              primaryHover: 'var(--primary-hover, #B89628)',
              cyan: '#06B6D4',
              emerald: '#10B981',
              rose: '#F43F5E'
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --primary-color: #D4AF37;
      --primary-hover: #B89628;
      --bg-main: #060913;
      --bg-card: rgba(11, 17, 32, 0.85);
    }

    /* Color Themes */
    [data-theme="emerald"] {
      --primary-color: #10B981;
      --primary-hover: #059669;
    }
    [data-theme="cyan"] {
      --primary-color: #06B6D4;
      --primary-hover: #0284C7;
    }
    [data-theme="rose"] {
      --primary-color: #F43F5E;
      --primary-hover: #E11D48;
    }

    body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    
    html.dark body { background-color: var(--bg-main); color: #f1f5f9; }
    html.dark .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    html.dark .glass-input {
      background: rgba(6, 9, 19, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    html.dark .header-bg { background: rgba(6, 9, 19, 0.9); border-color: rgba(255, 255, 255, 0.08); }
    html.dark .text-adaptive-main { color: #f8fafc; }
    html.dark .text-adaptive-sub { color: #94a3b8; }
    html.dark .text-adaptive-muted { color: #64748b; }

    html:not(.dark) body { background-color: #f4f6f9; color: #334155; }
    html:not(.dark) .glass-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }
    html:not(.dark) .glass-input {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #334155;
    }
    html:not(.dark) .header-bg { background: #ffffff; border-color: #e2e8f0; }
    html:not(.dark) .text-adaptive-main { color: #1e293b; }
    html:not(.dark) .text-adaptive-sub { color: #475569; }
    html:not(.dark) .text-adaptive-muted { color: #64748b; }

    .theme-accent-bg { background-color: var(--primary-color) !important; }
    .theme-accent-text { color: var(--primary-color) !important; }
    .theme-accent-border { border-color: var(--primary-color) !important; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #1e2d4a; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- TOOL PEMILIH TEMA (THEME CUSTOMIZER BAR) -->
  <div class="fixed bottom-4 right-4 z-50 flex items-center gap-2 p-2 bg-slate-900/90 dark:bg-corporate-900/90 backdrop-blur-md rounded-2xl border border-white/10 shadow-2xl">
    <span class="text-[10px] font-bold text-slate-300 pl-2 uppercase tracking-wider hidden sm:inline"><i class="fa-solid fa-palette mr-1"></i> Tema:</span>
    <button onclick="setAppTheme('gold')" class="w-6 h-6 rounded-full bg-[#D4AF37] border-2 border-white/20 hover:scale-110 transition-transform" title="Gold Corporate"></button>
    <button onclick="setAppTheme('emerald')" class="w-6 h-6 rounded-full bg-[#10B981] border-2 border-white/20 hover:scale-110 transition-transform" title="Emerald Dynamic"></button>
    <button onclick="setAppTheme('cyan')" class="w-6 h-6 rounded-full bg-[#06B6D4] border-2 border-white/20 hover:scale-110 transition-transform" title="Cyber Cyan"></button>
    <button onclick="setAppTheme('rose')" class="w-6 h-6 rounded-full bg-[#F43F5E] border-2 border-white/20 hover:scale-110 transition-transform" title="Crimson Premium"></button>
  </div>

  <div>
    <!-- LOGIN SCREEN -->
    <div id="loginOverlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 dark:bg-corporate-950/90 backdrop-blur-md">
      <div class="glass-card max-w-md w-full p-6 sm:p-8 rounded-3xl border theme-accent-border shadow-2xl">
        <div class="text-center mb-8">
          <div class="inline-flex p-4 rounded-2xl theme-accent-text bg-white/5 border border-white/10 mb-3">
            <i class="fa-solid fa-building-columns text-3xl"></i>
          </div>
          <h2 class="text-xl font-extrabold tracking-wider uppercase text-adaptive-main">AAAIIM <span class="theme-accent-text">OneFinance</span></h2>
          <p class="text-xs text-adaptive-muted mt-1 uppercase tracking-widest font-semibold">Enterprise Wealth Portal</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="text-[10px] font-bold text-adaptive-muted uppercase block mb-1">Username / ID Staf</label>
            <input type="text" id="loginUser" required placeholder="admin / staf / auditor" class="w-full p-3 rounded-xl glass-input text-xs outline-none">
          </div>
          <div>
            <label class="text-[10px] font-bold text-adaptive-muted uppercase block mb-1">Kata Sandi</label>
            <input type="password" id="loginPass" required placeholder="••••••••" class="w-full p-3 rounded-xl glass-input text-xs outline-none">
          </div>
          <button type="submit" class="w-full py-3.5 theme-accent-bg text-slate-950 font-bold rounded-xl text-xs uppercase shadow-lg transition-all hover:opacity-90 mt-2">
            Autentikasi Masuk
          </button>
        </form>
      </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="mainApp" class="hidden">
      <!-- HEADER -->
      <header class="sticky top-0 z-40 border-b header-bg">
        <div class="max-w-7xl mx-auto px-4 h-16 sm:h-20 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="p-2 sm:p-3 theme-accent-text bg-white/5 border border-white/10 rounded-2xl">
              <i class="fa-solid fa-chart-line text-lg sm:text-xl"></i>
            </div>
            <div>
              <h1 class="text-sm sm:text-lg font-black tracking-wider uppercase text-adaptive-main">AAAIIM <span class="theme-accent-text">OneFinance</span></h1>
              <p class="text-[9px] sm:text-[10px] text-adaptive-muted font-bold uppercase tracking-widest">Enterprise Wealth System</p>
            </div>
          </div>

          <div class="flex items-center gap-3">
            <button onclick="toggleDarkMode()" class="p-2.5 glass-card rounded-xl text-xs theme-accent-text" title="Mode Siang/Malam">
              <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
            <button onclick="handleLogout()" class="p-2.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 rounded-xl border border-rose-500/30 text-xs">
              <i class="fa-solid fa-power-off"></i>
            </button>
          </div>
        </div>

        <!-- NAVIGATION TABS -->
        <div class="max-w-7xl mx-auto px-2 flex space-x-2 overflow-x-auto border-t border-adaptive no-scrollbar py-2">
          <button onclick="switchTab('dashboard')" id="nav-dashboard" class="tab-btn active theme-accent-text border-b-2 theme-accent-border font-bold px-4 py-2 text-xs uppercase whitespace-nowrap">
            <i class="fa-solid fa-chart-pie mr-1"></i> Dashboard & Visual
          </button>
          <button onclick="switchTab('pencatatan')" id="nav-pencatatan" class="tab-btn text-adaptive-muted px-4 py-2 text-xs uppercase whitespace-nowrap">
            <i class="fa-solid fa-pen-to-square mr-1"></i> Transaksi
          </button>
          <button onclick="switchTab('rekeningkoran')" id="nav-rekeningkoran" class="tab-btn text-adaptive-muted px-4 py-2 text-xs uppercase whitespace-nowrap">
            <i class="fa-solid fa-receipt mr-1"></i> Mutasi Rekening
          </button>
        </div>
      </header>

      <!-- MAIN CONTAINER -->
      <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- TAB 1: DASHBOARD VISUAL (DENGAN CHART) -->
        <section id="tab-dashboard" class="tab-content space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="glass-card p-5 rounded-2xl">
              <span class="text-[10px] font-bold text-adaptive-muted uppercase">Total Pendapatan</span>
              <h3 class="text-2xl font-black text-emerald-500 mt-2" id="kpiIncome">Rp 0</h3>
            </div>
            <div class="glass-card p-5 rounded-2xl">
              <span class="text-[10px] font-bold text-adaptive-muted uppercase">Total Pengeluaran</span>
              <h3 class="text-2xl font-black text-rose-500 mt-2" id="kpiExpense">Rp 0</h3>
            </div>
            <div class="glass-card p-5 rounded-2xl border theme-accent-border">
              <span class="text-[10px] font-bold theme-accent-text uppercase">Laba Bersih</span>
              <h3 class="text-2xl font-black theme-accent-text mt-2" id="kpiNet">Rp 0</h3>
            </div>
            <div class="glass-card p-5 rounded-2xl">
              <span class="text-[10px] font-bold text-adaptive-muted uppercase">Total Kas/Bank</span>
              <h3 class="text-2xl font-black text-cyan-500 mt-2" id="kpiAssets">Rp 0</h3>
            </div>
          </div>

          <!-- ANALYTICS CHARTS TOOL (VISUALISASI GRAFIK BARU) -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 glass-card p-5 rounded-2xl">
              <h3 class="text-xs font-bold text-adaptive-main uppercase tracking-wider mb-4"><i class="fa-solid fa-chart-column theme-accent-text mr-2"></i> Grafik Ringkasan Keuangan</h3>
              <div class="h-64">
                <canvas id="financialChart"></canvas>
              </div>
            </div>
            <div class="glass-card p-5 rounded-2xl flex flex-col justify-center">
              <h3 class="text-xs font-bold text-adaptive-main uppercase tracking-wider mb-4"><i class="fa-solid fa-chart-pie theme-accent-text mr-2"></i> Proporsi Operasional</h3>
              <div class="h-56">
                <canvas id="categoryChart"></canvas>
              </div>
            </div>
          </div>
        </section>

        <!-- TAB 2: PENCATATAN -->
        <section id="tab-pencatatan" class="tab-content hidden space-y-6">
          <div class="glass-card p-6 rounded-2xl">
            <h2 class="text-sm font-bold text-adaptive-main uppercase mb-4">Input Transaksi Baru</h2>
            <form onsubmit="handleSaveTx(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              <div>
                <label class="text-[10px] font-bold text-adaptive-muted uppercase block mb-1">Tipe</label>
                <select id="txType" class="w-full p-3 rounded-xl glass-input text-xs font-medium">
                  <option value="Pendapatan">Pendapatan (+)</option>
                  <option value="Pengeluaran">Pengeluaran (-)</option>
                </select>
              </div>
              <div>
                <label class="text-[10px] font-bold text-adaptive-muted uppercase block mb-1">Nominal (Rp)</label>
                <input type="number" id="txAmount" placeholder="0" required class="w-full p-3 rounded-xl glass-input text-xs">
              </div>
              <div>
                <label class="text-[10px] font-bold text-adaptive-muted uppercase block mb-1">Kategori</label>
                <input type="text" id="txCategory" placeholder="Penjualan, Operasional, Gaji" required class="w-full p-3 rounded-xl glass-input text-xs">
              </div>
              <button type="submit" class="md:col-span-2 lg:col-span-3 py-3 theme-accent-bg text-slate-950 font-bold rounded-xl text-xs uppercase shadow-md">
                Simpan Transaksi
              </button>
            </form>
          </div>
        </section>

      </main>
    </div>
  </div>

  <!-- FIREBASE & JS SCRIPT -->
  <script>
    // State & Theme Management
    function setAppTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('selectedTheme', themeName);
      initCharts();
    }

    const savedTheme = localStorage.getItem('selectedTheme') || 'gold';
    setAppTheme(savedTheme);

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active', 'theme-accent-text', 'border-b-2', 'theme-accent-border', 'font-bold'));
      
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`nav-${tabName}`).classList.add('active', 'theme-accent-text', 'border-b-2', 'theme-accent-border', 'font-bold');
    }

    function handleLogin(e) {
      e.preventDefault();
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      initCharts();
    }

    function handleLogout() {
      document.getElementById('mainApp').classList.add('hidden');
      document.getElementById('loginOverlay').classList.remove('hidden');
    }

    // Chart.js Visual Tools Integration
    let finChart, catChart;
    function initCharts() {
      const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || '#D4AF37';

      const ctx1 = document.getElementById('financialChart')?.getContext('2d');
      if (ctx1) {
        if (finChart) finChart.destroy();
        finChart = new Chart(ctx1, {
          type: 'bar',
          data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'],
            datasets: [
              { label: 'Pendapatan', data: [12, 19, 15, 22, 30, 25], backgroundColor: '#10B981' },
              { label: 'Pengeluaran', data: [8, 12, 10, 14, 18, 15], backgroundColor: '#F43F5E' }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      const ctx2 = document.getElementById('categoryChart')?.getContext('2d');
      if (ctx2) {
        if (catChart) catChart.destroy();
        catChart = new Chart(ctx2, {
          type: 'doughnut',
          data: {
            labels: ['Operasional', 'Gaji', 'Sewa', 'Lainnya'],
            datasets: [{
              data: [45, 25, 15, 15],
              backgroundColor: [primaryColor, '#06B6D4', '#10B981', '#64748b']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }
  </script>
</body>
</html>
